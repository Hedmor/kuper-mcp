<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
<title id="title">Как строится меню</title><desc id="desc">Четыре этапа: точный адрес, товары магазина, проверка привязок и расчёт меню с целыми упаковками.</desc>
<rect width="1200" height="260" rx="24" fill="#F5F4EB"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="38" y="44" font-size="15" font-weight="700" fill="#526A58" letter-spacing="2">ОТ ЗАПРОСА К ПОКУПКАМ</text>
<g fill="none" stroke="#8FA78F" stroke-width="2"><path d="M286 148h32m-8-6 8 6-8 6M578 148h32m-8-6 8 6-8 6M870 148h32m-8-6 8 6-8 6"/></g>
<g transform="translate(32 75)"><rect width="248" height="151" rx="16" fill="#fff"/><circle cx="32" cy="32" r="17" fill="#E3EDDA"/><text x="32" y="37" text-anchor="middle" font-size="14" font-weight="700" fill="#355D42">1</text><text x="22" y="75" font-size="22" font-weight="700" fill="#203C2E">Точный адрес</text><text x="22" y="105" font-size="14" fill="#627065">Координаты доставки</text><text x="22" y="125" font-size="14" fill="#627065">и доступный магазин</text></g>
<g transform="translate(324 75)"><rect width="248" height="151" rx="16" fill="#fff"/><circle cx="32" cy="32" r="17" fill="#E3EDDA"/><text x="32" y="37" text-anchor="middle" font-size="14" font-weight="700" fill="#355D42">2</text><text x="22" y="75" font-size="22" font-weight="700" fill="#203C2E">Каталог</text><text x="22" y="105" font-size="14" fill="#627065">Цены, наличие, упаковки</text><text x="22" y="125" font-size="14" fill="#627065">и время снимка</text></g>
<g transform="translate(616 75)"><rect width="248" height="151" rx="16" fill="#fff"/><circle cx="32" cy="32" r="17" fill="#FFE4CF"/><text x="32" y="37" text-anchor="middle" font-size="14" font-weight="700" fill="#9F562C">3</text><text x="22" y="75" font-size="22" font-weight="700" fill="#203C2E">Проверка</text><text x="22" y="105" font-size="14" fill="#627065">Товар → ингредиент</text><text x="22" y="125" font-size="14" fill="#627065">Состав и единицы</text></g>
<g transform="translate(908 75)"><rect width="260" height="151" rx="16" fill="#203C2E"/><circle cx="32" cy="32" r="17" fill="#F9A364"/><text x="32" y="37" text-anchor="middle" font-size="14" font-weight="700" fill="#203C2E">4</text><text x="22" y="75" font-size="22" font-weight="700" fill="#FFF9EC">Меню и покупки</text><text x="22" y="105" font-size="14" fill="#CEDCC8">Бюджет, порции, остатки</text><text x="22" y="125" font-size="14" fill="#CEDCC8">и constraintsMet</text></g></g></svg>